amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.02

    laser_model_type: likelihood_field
    laser_max_range: 8.0
    laser_min_range: 0.12

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.25
    update_min_a: 0.2

    transform_tolerance: 0.2
    tf_broadcast: true
    scan_topic: scan


bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0

      acc_lim_x: 2.5
      acc_lim_theta: 3.2

      sim_time: 1.7

      critics:
        - BaseObstacle
        - PathAlign
        - PathDist
        - GoalAlign
        - GoalDist

      BaseObstacle.scale: 0.01


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      update_frequency: 10.0
      publish_frequency: 5.0

      robot_radius: 0.18

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 8
        max_obstacle_height: 1.0
        mark_threshold: 2

        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 1.5
          raytrace_max_range: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 6.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05

      robot_radius: 0.18

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 1.5
          raytrace_max_range: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 6.0


planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      allow_unknown: true


behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    cycle_frequency: 10.0


velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"

    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]

    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

    odom_topic: odom
    velocity_timeout: 1.0

